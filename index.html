<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EduFlow Demo</title>
<style>
:root{--navy:#112238;--green:#149879;--bg:#f3f6fa;--ink:#17263a;--muted:#718096;--line:#e4eaf1}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,"Noto Sans Bengali",sans-serif;color:var(--ink)}button,select,input{font:inherit}.app{display:flex;min-height:100vh}.side{width:235px;background:var(--navy);color:white;padding:22px 15px}.logo{font-size:22px;font-weight:800;padding:0 9px 20px}.logo span{background:linear-gradient(135deg,#16b88e,#4b83dd);padding:8px 11px;border-radius:11px;margin-right:8px}.side label{font-size:10px;color:#a9bdd1}.side select{width:100%;margin:7px 0 20px;padding:10px;border-radius:8px;background:#263d57;color:white;border:1px solid #405875}.nav button{display:block;width:100%;text-align:left;padding:11px;border:0;border-radius:8px;color:#cbd6e2;background:none;margin:3px 0;font-size:13px}.nav button.active,.nav button:hover{background:#29425f;color:white}.side small{display:block;color:#9fb2c7;margin:30px 8px;font-size:11px;line-height:1.6}.main{flex:1;min-width:0}.top{height:65px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 27px}.pill{background:#fff2d5;color:#91620a;border-radius:20px;padding:7px 11px;font-size:11px;font-weight:bold}.content{padding:26px;max-width:1350px;margin:auto}.welcome{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;gap:10px}.welcome h1{font-size:25px;margin:0 0 5px}.welcome p{font-size:13px;color:var(--muted);margin:0}.date{background:white;border:1px solid var(--line);border-radius:9px;padding:10px;font-size:11px;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:16px}.stat,.panel{background:white;border:1px solid var(--line);border-radius:13px;padding:17px}.stat small{color:var(--muted);font-size:11px}.stat strong{display:block;font-size:24px;margin:10px 0 3px}.stat .ico{float:right;background:#e5f7f1;color:#13866b;padding:9px;border-radius:9px}.row{display:grid;grid-template-columns:1.3fr 1fr;gap:15px}.panel{margin-bottom:15px}.panel h2{font-size:15px;margin:0 0 14px}.muted{color:var(--muted)}table{width:100%;border-collapse:collapse;white-space:nowrap}th{text-align:left;color:#8492a5;font-size:10px;padding:10px;border-bottom:1px solid var(--line)}td{padding:12px 10px;border-bottom:1px solid #eef2f6;font-size:12px}td small{display:block;color:var(--muted)}.tag{font-size:10px;font-weight:bold;border-radius:20px;padding:5px 8px;background:#e6f7f0;color:#168269}.due,.absent{background:#fff0f0;color:#c34c58}.late,.pending{background:#fff5df;color:#95650e}.btn{background:var(--green);color:white;border:0;border-radius:8px;padding:9px 12px;font-size:11px;font-weight:bold}.btn.alt{background:#edf2f7;color:#33445a}.btnline{display:flex;gap:8px;flex-wrap:wrap}.notice{padding:12px;border-radius:10px;background:#f5f8fc;margin:8px 0;font-size:12px}.notice b{display:block}.notice small{display:block;color:var(--muted);margin-top:4px;line-height:1.5}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.quick div{border:1px solid var(--line);border-radius:10px;padding:12px;font-size:12px}.quick small{display:block;color:var(--muted);margin:5px 0}.toast{display:none;position:fixed;bottom:20px;right:20px;background:#14263c;color:white;padding:14px 17px;border-radius:10px;font-size:12px;max-width:350px;z-index:10}.modal{display:none;position:fixed;inset:0;background:#09172999;align-items:center;justify-content:center;padding:20px;z-index:9}.modal>div{max-width:440px;background:white;padding:23px;border-radius:14px}.modal h3{margin:0 0 8px}.modal p{font-size:13px;color:#607087;line-height:1.6}.tablewrap{overflow:auto}.formrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.formrow select{padding:8px;border:1px solid #dce4ed;border-radius:8px}
@media(max-width:850px){.side{width:195px}.stats{grid-template-columns:repeat(2,1fr)}.content{padding:18px}}@media(max-width:620px){.app{display:block}.side{width:100%;padding:13px}.logo{padding-bottom:12px}.side select{max-width:280px;margin-bottom:10px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;width:auto}.side small{display:none}.top{height:52px;padding:0 14px}.content{padding:15px 12px}.row{grid-template-columns:1fr}.welcome{display:block}.date{display:inline-block;margin-top:10px}.quick{grid-template-columns:1fr 1fr}}
</style></head><body>
<div class="app"><aside class="side"><div class="logo"><span>E</span>EduFlow</div><label>SWITCH DEMO ROLE</label><select id="role" onchange="switchRole(this.value)"><option value="owner">Owner / Admin</option><option value="teacher">Teacher</option><option value="parent">Parent</option><option value="student">Student</option></select><div class="nav" id="nav"></div><small>DEMO INSTITUTE<br><b style="color:white">Bright Future Coaching</b><br>Sample data only · Prototype</small></aside>
<main class="main"><header class="top"><span id="crumb">Bright Future Coaching / Overview</span><span class="pill">DEMO MODE</span></header><div class="content" id="view"></div></main></div>
<div class="toast" id="toast"></div><div class="modal" id="modal"><div><h3 id="mt">Parent notification preview</h3><p id="mp"></p><button class="btn" onclick="document.getElementById('modal').style.display='none'">Close</button></div></div>
<script>
const data=[{id:'ST-101',name:'Aarav Hasan',cls:'Class 9 · Science',phone:'01700-000101',fee:'Paid',att:'Present',marks:'86%'},{id:'ST-102',name:'Nusrat Jahan',cls:'Class 9 · Science',phone:'01700-000102',fee:'Due',att:'Absent',marks:'91%'},{id:'ST-103',name:'Rafi Ahmed',cls:'Class 10 · Commerce',phone:'01700-000103',fee:'Paid',att:'Present',marks:'78%'},{id:'ST-104',name:'Maliha Rahman',cls:'Class 8 · General',phone:'01700-000104',fee:'Due',att:'Late',marks:'82%'},{id:'ST-105',name:'Tanvir Islam',cls:'Class 10 · Science',phone:'01700-000105',fee:'Paid',att:'Present',marks:'89%'}];
const menus={owner:[['home','▦','Overview'],['students','♙','Students'],['fees','৳','Fee Management'],['attendance','✓','Attendance'],['results','▤','Results'],['notices','◉','Notices']],teacher:[['home','▦','My Classes'],['attendance','✓','Take Attendance'],['results','▤','Enter Results'],['notices','◉','Homework & Notices']],parent:[['home','▦','My Child'],['fees','৳','Fee Status'],['attendance','✓','Attendance'],['results','▤','Results'],['notices','◉','Notices']],student:[['home','▦','My Dashboard'],['attendance','✓','My Attendance'],['results','▤','My Results'],['notices','◉','Homework']]};
let role='owner',page='home';function switchRole(r){role=r;page='home';render()}function go(p){page=p;render()}
function nav(){document.getElementById('nav').innerHTML=menus[role].map(x=>`<button class="${page===x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]} &nbsp; ${x[2]}</button>`).join('');document.getElementById('crumb').textContent='Bright Future Coaching / '+(menus[role].find(x=>x[0]===page)||[])[2]}
function stat(a,b,c,i){return `<div class="stat"><span class="ico">${i}</span><small>${a}</small><strong>${b}</strong><small>${c}</small></div>`}
function panel(t,b){return `<section class="panel"><h2>${t}</h2>${b}</section>`}
function header(t,d){return `<div class="welcome"><div><h1>${t}</h1><p>${d}</p></div><span class="date">📅 03 November 2026</span></div>`}
function table(rows=data){return `<div class="tablewrap"><table><thead><tr><th>STUDENT</th><th>CLASS</th><th>FEE</th><th>ATTENDANCE</th><th>RESULT</th></tr></thead><tbody>${rows.map(s=>`<tr><td><b>${s.name}</b><small>${s.id}</small></td><td>${s.cls}</td><td><span class="tag ${s.fee==='Due'?'due':''}">${s.fee}</span></td><td><span class="tag ${s.att==='Absent'?'absent':s.att==='Late'?'late':''}">${s.att}</span></td><td>${s.marks}</td></tr>`).join('')}</tbody></table></div>`}
function notices(){return `<div class="notice">📢 <b>Monthly test schedule</b><small>Class 9 and 10 · Exam begins next Sunday.</small></div><div class="notice">📚 <b>Mathematics homework</b><small>Complete exercise 5.2 before the next class.</small></div><div class="notice">🕒 <b>Friday class timing update</b><small>Class 8 batch starts at 4:00 PM.</small></div>`}
function render(){nav();let v='';
if(role==='owner'){
if(page==='home')v=header('Good morning, Admin 👋','Here’s what is happening at your coaching center today.')+`<div class="stats">${stat('Total Students','248','Across 8 active batches','♙')}${stat('Fees Collected','৳1,84,500','This month · sample','৳')}${stat('Fees Due','৳32,000','From 41 students','!')}${stat('Today Present','91%','Attendance overview','✓')}</div><div class="row"><div>${panel('Recent student activity',table(data.slice(0,4)))}${panel('Quick actions',`<div class="quick"><div>♙<b>Add student</b><small>Register a learner</small><button class="btn" onclick="toast('Demo: student registration form')">Open</button></div><div>৳<b>Record fee</b><small>Update payment</small><button class="btn" onclick="go('fees')">Open</button></div><div>✓<b>Attendance</b><small>Review attendance</small><button class="btn" onclick="go('attendance')">Open</button></div></div>`)}</div><div>${panel('Needs your attention',`<div class="notice">৳ <b>41 students have outstanding fees</b><small>Review dues and send guardian reminders.</small></div><div class="notice">✓ <b>Attendance alerts today</b><small>Parents can be notified when a student is absent.</small></div><div class="notice">▤ <b>Monthly test results pending</b><small>Some marks are waiting to be entered.</small></div>`)}${panel('Recent updates',notices())}</div></div>`;
if(page==='students')v=header('Students','Manage student profiles, batches and guardian contacts.')+panel('Student directory',table());
if(page==='fees')v=header('Fee Management','Track monthly payments, dues and receipts.')+`<div class="stats">${stat('Collected','৳1,84,500','This month','৳')}${stat('Outstanding','৳32,000','41 students','!')}${stat('Paid students','207','This month','✓')}${stat('Reminders','18','Sample queue','✉')}</div>`+panel('Fee records',`<div class="tablewrap"><table><thead><tr><th>STUDENT</th><th>MONTH</th><th>AMOUNT</th><th>STATUS</th><th>ACTION</th></tr></thead><tbody>${data.map((s,i)=>`<tr><td>${s.name}</td><td>November 2026</td><td>৳${i%2?1200:1500}</td><td><span class="tag ${s.fee==='Due'?'due':''}">${s.fee}</span></td><td>${s.fee==='Due'?`<button class="btn" onclick="paid('${s.id}')">Mark paid</button>`:'<button class="btn" onclick="toast(\'Demo receipt preview\')">Receipt</button>'}</td></tr>`).join('')}</tbody></table></div>`);
if(page==='attendance')v=header('Attendance Overview','Review attendance. Switch to Teacher to demonstrate marking absent.')+panel('Today’s attendance',table());
if(page==='results')v=header('Exam Results','Review student assessment performance.')+panel('Monthly assessment',table());
if(page==='notices')v=header('Notices & Messages','Publish updates for students and guardians.')+panel('Recent notices',notices());
}
if(role==='teacher'){
if(page==='home')v=header('Hello, Teacher!','Your classes and daily teaching tasks at a glance.')+`<div class="stats">${stat('My batches','3','Assigned batches','▦')}${stat('Students','86','Across your batches','♙')}${stat('Today’s classes','2','1 completed · 1 upcoming','◷')}${stat('Pending marks','12','Monthly assessment','▤')}</div><div class="row">${panel('Today’s classes',`<div class="notice">📘 <b>Class 9 · Mathematics</b><small>3:00 PM – 4:00 PM · Room 02</small></div><div class="notice">📐 <b>Class 10 · Mathematics</b><small>5:00 PM – 6:00 PM · Room 01</small></div>`)}${panel('Teaching shortcuts',`<div class="btnline"><button class="btn" onclick="go('attendance')">Take attendance</button><button class="btn" onclick="go('results')">Enter marks</button><button class="btn" onclick="go('notices')">Post homework</button></div>`)}</div>`;
if(page==='attendance')v=header('Take Attendance','Change a student to Absent to preview the guardian alert.')+panel('Class 9 · Mathematics',`<div class="tablewrap"><table><thead><tr><th>STUDENT</th><th>GUARDIAN</th><th>STATUS</th></tr></thead><tbody>${data.filter(s=>s.cls.includes('9')).map(s=>`<tr><td><b>${s.name}</b><small>${s.id}</small></td><td>${s.phone}</td><td><select onchange="att('${s.id}',this.value)" style="padding:8px;border:1px solid #ddd;border-radius:7px"><option ${s.att==='Present'?'selected':''}>Present</option><option ${s.att==='Absent'?'selected':''}>Absent</option><option ${s.att==='Late'?'selected':''}>Late</option></select></td></tr>`).join('')}</tbody></table></div><p class="muted" style="font-size:11px">Demo preview only. No real SMS or WhatsApp message is sent.</p>`);
if(page==='results')v=header('Enter Results','Record assessment marks for your assigned students.')+panel('Monthly test · Mathematics',`<div class="tablewrap"><table><tr><th>STUDENT</th><th>MARKS / 100</th><th>STATUS</th></tr>${data.slice(0,4).map(s=>`<tr><td>${s.name}</td><td><input type="number" value="82" style="width:65px;padding:7px;border:1px solid #ddd;border-radius:7px"></td><td><span class="tag pending">Draft</span></td></tr>`).join('')}</table></div><button class="btn" style="margin-top:12px" onclick="toast('Demo marks saved for preview')">Save Marks</button>`);
if(page==='notices')v=header('Homework & Notices','Share class updates with students and guardians.')+panel('Create a notice',`<input placeholder="Notice title" style="padding:10px;border:1px solid #ddd;border-radius:8px;width:100%;margin-bottom:9px"><input placeholder="Write homework or class update..." style="padding:10px;border:1px solid #ddd;border-radius:8px;width:100%;margin-bottom:10px"><button class="btn" onclick="toast('Demo notice published')">Publish Notice</button>`)+panel('Recent notices',notices());
}
if(role==='parent'){
if(page==='home')v=header('Welcome back, Parent','Here is your child’s learning update.')+`<div class="panel"><h2>Nusrat Jahan <span class="tag absent">Absent today</span></h2><p class="muted" style="font-size:11px">Class 9 · Science · Student ID ST-102</p><div class="stats">${stat('Attendance','92%','This month','✓')}${stat('Monthly fee','Due','November 2026','৳')}${stat('Latest result','91%','Monthly assessment','▤')}${stat('Homework','2','Pending tasks','✎')}</div></div><div class="row">${panel('Latest updates',`<div class="notice">✓ <b>Attendance alert</b><small>Your child was marked absent from today’s Mathematics class.</small></div><div class="notice">📚 <b>Homework assigned</b><small>Mathematics · Exercise 5.2 · Due Thursday.</small></div>`)}${panel('Fee reminder',`<div class="notice">৳ <b>November fee: ৳1,200</b><small>Payment status: Due. Contact the coaching office for payment options.</small></div><button class="btn" onclick="toast('Demo payment details')">View payment details</button>`)}</div>`;
if(page==='fees')v=header('Fee Status','View monthly coaching fee records.')+panel('Payment history',`<table><tr><th>MONTH</th><th>AMOUNT</th><th>STATUS</th></tr><tr><td>November 2026</td><td>৳1,200</td><td><span class="tag due">Due</span></td></tr><tr><td>October 2026</td><td>৳1,200</td><td><span class="tag">Paid</span></td></tr></table>`);
if(page==='attendance')v=header('Attendance History','Track your child’s class attendance.')+`<div class="stats">${stat('Present','18','Days','✓')}${stat('Absent','2','Days','!')}${stat('Late','1','Days','◷')}${stat('Attendance','92%','This month','▦')}</div>`;
if(page==='results')v=header('Exam Results','Review your child’s academic progress.')+panel('Monthly assessment',`<table><tr><th>SUBJECT</th><th>MARKS</th><th>GRADE</th></tr><tr><td>Mathematics</td><td>91/100</td><td>A+</td></tr><tr><td>English</td><td>86/100</td><td>A</td></tr><tr><td>Science</td><td>89/100</td><td>A</td></tr></table>`);
if(page==='notices')v=header('Notices','Updates shared by the coaching center.')+panel('Latest notices',notices());
}
if(role==='student'){
if(page==='home')v=header('Hello, Nusrat! 📚','Keep learning. Your class information is right here.')+`<div class="stats">${stat('Attendance','92%','This month','✓')}${stat('Latest result','91%','Monthly test','▤')}${stat('Homework','2','Pending tasks','✎')}${stat('Next class','5:00 PM','Mathematics · Today','◷')}</div><div class="row">${panel('Today’s routine',`<div class="notice">📐 <b>Mathematics</b><small>5:00 PM – 6:00 PM · Room 01</small></div><div class="notice">📖 <b>English</b><small>6:15 PM – 7:00 PM · Room 03</small></div>`)}${panel('Homework',`<div class="notice">✎ <b>Mathematics · Exercise 5.2</b><small>Complete questions 1–8 before Thursday.</small></div>`)}</div>`;
if(page==='attendance')v=header('My Attendance','Your monthly attendance record.')+`<div class="stats">${stat('Present','18','Days','✓')}${stat('Absent','2','Days','!')}${stat('Late','1','Days','◷')}${stat('Attendance','92%','This month','▦')}</div>`;
if(page==='results')v=header('My Results','See your recent exam performance.')+panel('Monthly assessment',`<table><tr><th>SUBJECT</th><th>MARKS</th><th>GRADE</th></tr><tr><td>Mathematics</td><td>91/100</td><td>A+</td></tr><tr><td>English</td><td>86/100</td><td>A</td></tr><tr><td>Science</td><td>89/100</td><td>A</td></tr></table>`);
if(page==='notices')v=header('Homework & Notices','Your teachers’ latest updates.')+panel('Latest updates',notices());
}
document.getElementById('view').innerHTML=v}
function toast(t){let e=document.getElementById('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',3000)}
function paid(id){let s=data.find(x=>x.id===id);s.fee='Paid';toast('Demo payment recorded for '+s.name+'. Receipt preview available.');render()}
function att(id,val){let s=data.find(x=>x.id===id);s.att=val;if(val==='Absent'){document.getElementById('mt').textContent='Parent notification preview';document.getElementById('mp').textContent=`A demo notification is ready for ${s.phone}: "${s.name} was marked absent from today’s class at Bright Future Coaching." In a live system, this would be sent through an approved SMS or WhatsApp provider after setup and guardian consent.`;document.getElementById('modal').style.display='flex'}else toast(s.name+' attendance updated to '+val)}
render();
</script></body></html>
